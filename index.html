<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Editor</title>
    <style>
      @import url("./style_skill/tokens.css");
      @import url("./style_skill/reset.css");
      @import url("./style_skill/button.css");
      @import url("./style_skill/segmented.css");
      @import url("./style_skill/navigation-sidebar.css");

      :root {
        --kd-color-public-normal: rgba(var(--kd-color-indigo-6), 1);
        --kd-color-public-hover: rgba(var(--kd-color-indigo-5), 1);
        --kd-color-public-pressed: rgba(var(--kd-color-indigo-7), 1);
        --kd-color-state-pressed-public: rgba(var(--kd-color-indigo-6), 0.12);

        --app-space-1: 4px;
        --app-space-2: 8px;
        --app-space-3: 12px;
        --app-space-4: 16px;
        --app-space-5: 20px;
        --app-space-6: 24px;
        --app-control-height-m: 34px;
        --app-icon-size-m: 16px;
        --app-icon-size-s: 14px;
        --app-fmt-icon-size: 27px;
        --app-input-radius: 15px;
        --app-statusbar-height: 40px;
        --app-content-bottom-gap: 52px;
        --app-code-line-height: 1.7;
        --app-format-active-bg: rgba(var(--kd-color-blue-6), 1);
        --app-icon-stroke-m: 1.6;
        --app-dark-control-bg: color-mix(in srgb, var(--kd-color-fill-light) 66%, #000 34%);
        --app-dark-control-bg-hover: color-mix(in srgb, var(--kd-color-fill-light) 76%, #000 24%);
        --app-dark-icon-filter: brightness(0) invert(0.92);
      }

      [data-theme="dark"] {
        --kd-color-public-normal: rgba(var(--kd-color-indigo-7), 1);
        --kd-color-public-hover: rgba(var(--kd-color-indigo-8), 1);
        --kd-color-public-pressed: rgba(var(--kd-color-indigo-6), 1);
        --app-format-active-bg: rgba(var(--kd-color-blue-5), 1);
        --kd-color-text-primary: #ffffff;
        --kd-color-text-secondary: #ffffff;
        --kd-color-text-tertiary: rgba(255, 255, 255, 0.82);
        --kd-color-icon-primary: #ffffff;
        --kd-color-icon-secondary: #ffffff;
        --kd-color-line-heavy: #3f3f3f;
        --kd-color-line-medium: #3f3f3f;
        --kd-color-line-regular: #3f3f3f;
        --kd-color-line-light: #3f3f3f;
        --kd-box-shadow-small: none;
        --kd-box-shadow-middle: 0 8px 20px rgba(0, 0, 0, 0.45);
      }

      [data-theme="dark"] .sidebar,
      [data-theme="dark"] .topbar,
      [data-theme="dark"] .workspace,
      [data-theme="dark"] .statusbar {
        border-color: #3f3f3f;
        background: color-mix(in srgb, var(--kd-color-fill-base) 86%, #000 14%);
        box-shadow: none;
      }

      [data-theme="dark"] .theme-toggle,
      [data-theme="dark"] .view-icon-btn,
      [data-theme="dark"] .action-icon-btn.plain,
      [data-theme="dark"] .icon-btn {
        color: var(--kd-color-text-primary);
      }

      [data-theme="dark"] .view-icon-btn,
      [data-theme="dark"] .action-icon-btn.plain,
      [data-theme="dark"] .theme-toggle {
        border-color: #3f3f3f;
        background: var(--app-dark-control-bg);
      }

      [data-theme="dark"] .icon-btn:hover,
      [data-theme="dark"] .action-icon-btn.plain:hover,
      [data-theme="dark"] .view-icon-btn:hover,
      [data-theme="dark"] .theme-toggle:hover,
      [data-theme="dark"] .recent-item:hover,
      [data-theme="dark"] .recent-item.is-menu-open,
      [data-theme="dark"] .recent-menu-item:hover,
      [data-theme="dark"] .export-menu button:hover,
      [data-theme="dark"] .recent-submenu button:hover {
        background: var(--app-dark-control-bg-hover);
      }

      [data-theme="dark"] .tool-icon,
      [data-theme="dark"] .fmt-icon,
      [data-theme="dark"] .view-icon,
      [data-theme="dark"] .action-icon {
        filter: var(--app-dark-icon-filter);
      }

      [data-theme="dark"] .icon-btn.is-active .fmt-icon {
        filter: brightness(0) invert(1);
      }

      [data-theme="dark"] input,
      [data-theme="dark"] textarea,
      [data-theme="dark"] select,
      [data-theme="dark"] .recent-title,
      [data-theme="dark"] .recent-item,
      [data-theme="dark"] .recent-item-more,
      [data-theme="dark"] .recent-empty,
      [data-theme="dark"] .muted,
      [data-theme="dark"] .statusbar,
      [data-theme="dark"] .kd-navigation-item,
      [data-theme="dark"] #previewHost,
      [data-theme="dark"] #editorHost .cm-editor,
      [data-theme="dark"] #editorHost .cm-content,
      [data-theme="dark"] #editorHost .cm-line {
        color: #ffffff;
        caret-color: #ffffff;
      }

      [data-theme="dark"] .kd-navigation-item.is-active {
        color: var(--kd-color-public-normal);
      }

      [data-theme="dark"] input::placeholder,
      [data-theme="dark"] textarea::placeholder {
        color: rgba(255, 255, 255, 0.82);
        opacity: 1;
      }

      [data-theme="dark"] .input-search input,
      [data-theme="dark"] .hero-dropzone textarea,
      [data-theme="dark"] .recent-rename-input,
      [data-theme="dark"] .recent-item {
        border-color: #3f3f3f;
        color: #ffffff;
        background: color-mix(in srgb, var(--kd-color-fill-base) 90%, #000 10%);
      }

      [data-theme="dark"] .hero-dropzone textarea {
        box-shadow: none;
      }

      [data-theme="dark"] .input-search::before,
      [data-theme="dark"] .kd-navigation-item__icon img {
        filter: var(--app-dark-icon-filter);
      }

      [data-theme="dark"] .kd-navigation-item.is-active .kd-navigation-item__icon img {
        filter: brightness(0) invert(1);
      }

      [data-theme="dark"] .recent-menu,
      [data-theme="dark"] .recent-submenu,
      [data-theme="dark"] .export-menu,
      [data-theme="dark"] .lang-menu {
        border-color: var(--kd-color-line-medium);
        background: color-mix(in srgb, var(--kd-color-fill-base) 88%, #000 12%);
      }

      [data-theme="dark"] #previewHost pre {
        border-color: var(--kd-color-line-medium);
        background: color-mix(in srgb, var(--kd-color-fill-light) 70%, #000 30%);
      }

      [data-theme="dark"] #previewHost blockquote {
        border-left-color: var(--kd-color-public-normal);
        background: color-mix(in srgb, var(--kd-color-fill-light) 68%, #000 32%);
        color: var(--kd-color-text-secondary);
      }

      [data-theme="dark"] #previewHost th {
        background: color-mix(in srgb, var(--kd-color-fill-light) 74%, #000 26%);
      }

      [data-theme="dark"] #previewHost th,
      [data-theme="dark"] #previewHost td {
        border-color: var(--kd-color-line-medium);
      }

      [data-theme="dark"] #editorHost .cm-gutters {
        border-right-color: var(--kd-color-line-medium);
        background: color-mix(in srgb, var(--kd-color-fill-base) 90%, #000 10%);
      }

      [data-theme="dark"] .icon-btn.is-inactive .fmt-icon {
        opacity: 0.35;
      }

      body {
        margin: 0;
        font-family: var(--kd-font-family);
        font-size: var(--kd-font-size-base);
        line-height: var(--kd-font-line-height-base);
        color: var(--kd-color-text-primary);
        background: var(--kd-color-background-base);
        height: 100vh;
        overflow: hidden;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 232px 1fr;
        gap: var(--app-space-3);
        padding: var(--app-space-3);
      }

      body[data-app-ready="0"] .app {
        visibility: hidden;
      }

      .sidebar {
        border: 1px solid var(--kd-color-line-regular);
        border-radius: var(--kd-border-radius-extra-large);
        background: var(--kd-color-fill-base);
        box-shadow: var(--kd-box-shadow-small);
        padding: var(--app-space-4) var(--app-space-3);
        display: flex;
        flex-direction: column;
        gap: var(--app-space-3);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: var(--app-space-2);
        cursor: pointer;
      }

      .brand:focus-visible {
        outline: none;
        box-shadow: var(--kd-box-shadow-glow);
        border-radius: var(--kd-border-radius-middle);
      }

      .brand img {
        width: 28px;
        height: 28px;
        border-radius: var(--kd-border-radius-middle);
        object-fit: contain;
      }

      .brand h1 {
        margin: 0;
        color: var(--kd-color-public-normal);
        font-size: var(--kd-font-size-xx-large);
        line-height: var(--kd-font-line-height-xx-large);
        font-weight: var(--kd-font-weight-bold);
      }

      .side-actions {
        display: flex;
        flex-direction: column;
        gap: var(--app-space-2);
      }

      .side-actions .kd-navigation-item {
        width: 100%;
        justify-content: flex-start;
        gap: 10px;
        padding-left: var(--app-space-3);
      }

      .kd-navigation-item__icon svg {
        width: var(--app-icon-size-s);
        height: var(--app-icon-size-s);
        stroke: currentColor;
        fill: none;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .kd-navigation-item__icon img,
      .kd-button-prefix-icon img {
        width: var(--app-icon-size-s);
        height: var(--app-icon-size-s);
        display: block;
      }

      .input-search {
        position: relative;
      }

      .input-search input {
        width: 100%;
        height: 36px;
        border: 1px solid var(--kd-color-line-medium);
        border-radius: var(--kd-border-radius-circle);
        background: var(--kd-color-fill-base);
        color: var(--kd-color-text-primary);
        font-size: var(--kd-font-size-sub-base);
        line-height: var(--kd-line-height-base);
        padding: 0 var(--app-space-3) 0 36px;
      }

      .input-search::before {
        content: "";
        width: 18px;
        height: 18px;
        position: absolute;
        left: var(--app-space-2);
        top: 9px;
        background: no-repeat center / contain url("./style_skill/icons/magnifier.svg");
        opacity: var(--kd-opacity-icon-hover);
      }

      .recent-title {
        color: var(--kd-color-text-tertiary);
        font-size: var(--kd-font-size-sub-base);
        line-height: var(--kd-line-height-base);
      }

      select,
      textarea,
      input {
        border: 1px solid var(--kd-color-line-medium);
        border-radius: var(--kd-border-radius-large);
        background: var(--kd-color-fill-base);
        color: var(--kd-color-text-primary);
        font-family: var(--kd-font-family);
        font-size: var(--kd-font-size-sub-base);
        line-height: var(--kd-line-height-base);
      }

      textarea,
      select {
        padding: var(--app-space-2) var(--app-space-3);
      }

      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .kd-button:focus-visible,
      .kd-navigation-item:focus-visible {
        outline: none;
        border-color: var(--kd-color-line-public);
        box-shadow: var(--kd-box-shadow-glow);
      }

      .muted {
        color: var(--kd-color-text-tertiary);
        font-size: var(--kd-font-size-small);
        line-height: var(--kd-line-height-small);
      }

      .content {
        height: 100%;
        min-height: 0;
        position: relative;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: var(--app-space-3);
        overflow: hidden;
        padding-bottom: var(--app-content-bottom-gap);
      }

      .initial-header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: var(--app-space-2);
      }

      .theme-toggle {
        width: var(--app-control-height-m);
        height: var(--app-control-height-m);
        border-radius: var(--kd-border-radius-large);
        border: 1px solid var(--kd-color-line-light);
        background: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .theme-toggle:hover {
        background: #ffffff;
        border-color: var(--kd-color-line-regular);
      }

      .theme-icon {
        width: 18px;
        height: 18px;
      }

      .tool-icon {
        width: var(--app-icon-size-m);
        height: var(--app-icon-size-m);
        display: block;
      }

      [data-theme="dark"] .theme-toggle {
        background: transparent;
        border-color: var(--kd-color-line-medium);
      }

      [data-theme="dark"] .theme-toggle:hover {
        background: transparent;
        border-color: var(--kd-color-line-regular);
      }

      .topbar {
        border: 1px solid var(--kd-color-line-regular);
        border-radius: var(--kd-border-radius-extra-large);
        background: var(--kd-color-fill-base);
        box-shadow: var(--kd-box-shadow-small);
        padding: var(--app-space-3);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: var(--app-space-3);
      }

      .topbar-group {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--app-space-2);
      }

      .icon-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-toolbar.hidden {
        display: none;
      }

      .icon-btn {
        width: var(--app-control-height-m);
        height: var(--app-control-height-m);
        border: none;
        border-radius: var(--kd-border-radius-small);
        background: transparent;
        color: var(--kd-color-text-primary);
        font-size: var(--kd-font-size-sub-base);
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
      }

      .icon-btn:hover {
        background: var(--kd-color-state-hover);
      }

      .icon-btn.is-active {
        background: var(--app-format-active-bg);
      }

      .icon-btn.is-active .fmt-icon {
        filter: brightness(0) invert(1);
      }

      .fmt-icon {
        width: var(--app-fmt-icon-size);
        height: var(--app-fmt-icon-size);
        display: block;
      }

      .icon-btn.is-inactive .fmt-icon {
        opacity: 0.45;
        filter: grayscale(1) saturate(0);
      }

      #fmtCodeBtn.is-active .fmt-icon {
        filter: brightness(0) invert(1);
      }

      .icon-btn[data-tip]:hover::after {
        content: attr(data-tip);
        position: absolute;
        left: 50%;
        top: calc(100% + 8px);
        transform: translateX(-50%);
        min-width: 164px;
        max-width: 220px;
        padding: 6px 8px;
        border-radius: var(--kd-border-radius-large);
        background: var(--kd-color-feedback-regular);
        color: var(--kd-color-text-white);
        font-size: var(--kd-font-size-sub-base);
        line-height: var(--kd-line-height-small);
        white-space: pre-line;
        box-shadow: var(--kd-box-shadow-middle);
        z-index: 20;
        pointer-events: none;
      }

      .icon-btn[data-tip]:hover::before {
        content: "";
        position: absolute;
        left: 50%;
        top: calc(100% + 5px);
        transform: translateX(-50%) rotate(45deg);
        width: 8px;
        height: 8px;
        background: var(--kd-color-feedback-regular);
        z-index: 20;
        pointer-events: none;
      }

      .view-icon-btn {
        width: 36px;
        min-width: 36px;
        padding: 0;
      }

      .view-icon {
        width: 16px;
        height: 16px;
      }

      .action-icon-btn {
        width: var(--app-control-height-m);
        min-width: var(--app-control-height-m);
        height: var(--app-control-height-m);
        padding: 0;
      }

      .action-icon-btn.plain {
        border: none;
        background: transparent;
      }

      .action-icon-btn.plain:hover {
        background: var(--kd-color-state-hover);
      }

      .action-icon-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        pointer-events: none;
      }

      .action-icon {
        width: var(--app-icon-size-m);
        height: var(--app-icon-size-m);
      }

      .undo-redo-icon {
        width: 16px;
        height: 16px;
        display: block;
      }

      .undo-redo-icon path {
        stroke-width: var(--app-icon-stroke-m);
      }

      .top-action-group {
        position: relative;
      }

      .action-icon-btn.plain.lang-btn {
        width: var(--app-control-height-m);
        min-width: var(--app-control-height-m);
        height: var(--app-control-height-m);
        border: 1px solid var(--kd-color-line-regular);
        border-radius: var(--kd-border-radius-large);
        background: #ffffff;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--kd-color-text-primary);
      }

      .action-icon-btn.plain.lang-btn:hover {
        background: #ffffff;
        border-color: var(--kd-color-line-regular);
      }

      [data-theme="dark"] .action-icon-btn.plain.lang-btn {
        background: transparent;
      }

      [data-theme="dark"] .action-icon-btn.plain.lang-btn:hover {
        background: transparent;
        border-color: var(--kd-color-line-regular);
      }

      .lang-btn-icon,
      .lang-btn-caret {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .lang-btn-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
      }

      .lang-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 120px;
        border: 1px solid var(--kd-color-line-regular);
        border-radius: var(--kd-border-radius-middle);
        background: var(--kd-color-fill-base);
        box-shadow: var(--kd-box-shadow-middle);
        padding: 4px;
        display: none;
        z-index: 12;
      }

      .lang-menu.is-open {
        display: block;
      }

      .lang-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: var(--kd-color-text-primary);
        text-align: left;
        font-size: var(--kd-font-size-sub-base);
        line-height: var(--kd-line-height-base);
        border-radius: var(--kd-border-radius-small);
        padding: 7px 8px;
        cursor: pointer;
      }

      .lang-menu button:hover {
        background: var(--kd-color-state-hover);
      }

      .lang-menu button.is-active {
        color: var(--kd-color-text-brand);
        background: color-mix(in srgb, var(--kd-color-state-hover) 62%, var(--kd-color-brand-1) 38%);
      }

      .export-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 150px;
        border: 1px solid var(--kd-color-line-regular);
        border-radius: var(--kd-border-radius-middle);
        background: var(--kd-color-fill-base);
        box-shadow: var(--kd-box-shadow-middle);
        padding: 4px;
        display: none;
        z-index: 12;
      }

      .export-menu.is-open {
        display: block;
      }

      .export-menu button {
        width: 100%;
        border: none;
        background: transparent;
        color: var(--kd-color-text-primary);
        text-align: left;
        font-size: var(--kd-font-size-sub-base);
        line-height: var(--kd-line-height-base);
        border-radius: var(--kd-border-radius-small);
        padding: 7px 8px;
        cursor: pointer;
      }

      .export-menu button:hover {
        background: var(--kd-color-state-hover);
      }

      .workspace-wrap {
        min-height: 0;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: var(--app-space-3);
        overflow: hidden;
      }

      [data-ui-mode="edit"] .workspace-wrap {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
      }

      [data-ui-mode="edit"] .content {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      [data-ui-mode="edit"] .topbar {
        flex: 0 0 auto;
      }

      [data-ui-mode="initial"] .workspace-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 20vh;
      }

      .hero {
        border: none;
        border-radius: var(--kd-border-radius-extra-large);
        background: transparent;
        box-shadow: none;
        padding: 0;
        width: min(1040px, 100%);
      }

      .hero h2 {
        margin: 0 0 40px;
        color: var(--kd-color-public-normal);
        text-align: center;
        font-size: 50px;
        line-height: var(--kd-font-line-height-xxx-large);
        font-weight: var(--kd-font-weight-bold);
        transform: translateX(-36px);
      }

      .hero-upload {
        max-width: 640px;
        margin: 0 auto;
        transform: translateX(-36px);
      }

      .hero-dropzone {
        position: relative;
        border: none;
        border-radius: var(--kd-border-radius-large);
        padding: 0;
        transition: var(--kd-all-transition);
      }

      .hero-dropzone.is-dragover {
        box-shadow: var(--kd-box-shadow-glow);
      }

      .hero-dropzone textarea {
        display: block;
        width: 100%;
        min-height: 44px;
        max-height: 180px;
        resize: none;
        border-radius: var(--app-input-radius);
        border: 1px solid var(--kd-color-line-medium);
        background: var(--kd-color-fill-base);
        padding: var(--app-space-3);
        padding-right: 90px;
        padding-bottom: 36px;
        box-shadow: var(--kd-box-shadow-small);
        overflow-y: hidden;
      }

      .hero-dropzone.is-dragover textarea {
        border-color: var(--kd-color-line-public);
        min-height: 96px;
      }

      .hero-upload-btn {
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 2;

      async function fetchPresetDocContent(preset) {
        try {
          const res = await fetch(encodeURI(preset.url), { cache: "no-store" });
          if (!res.ok) return preset.embedded || preset.fallback;
          const text = await res.text();
          return text.trim() ? text : preset.embedded || preset.fallback;
        } catch {
          return preset.embedded || preset.fallback;
        }
      }

      async function ensurePresetRecentDocs() {
        const list = getRecentList().filter((item) => {
          const path = item.path || "";
          if (LEGACY_PRESET_PATHS.has(path)) return false;
          return true;
        });
        const now = Date.now();
        const loaded = await Promise.all(
          PRESET_DOCS.map(async (preset, idx) => ({
            ...preset,
            content: await fetchPresetDocContent(preset),
            ts: now - idx
          }))
        );

        loaded.forEach((preset, idx) => {
          const existingIdx = list.findIndex((item) => item.path === preset.path);
          const existing = existingIdx >= 0 ? list[existingIdx] : null;
          const keepExistingContent =
            !!existing?.content &&
            !String(existing.content).includes("预设文档加载失败") &&
            !String(existing.content).includes("Preset file load failed");
          const nextItem = {
            ...(existing || {}),
            id: existing?.id || `preset-${idx + 1}`,
            name: preset.name,
            path: preset.path,
            content: keepExistingContent ? existing.content : preset.content,
            ts: existing?.ts || preset.ts
          };
          if (existingIdx >= 0) {
            list[existingIdx] = nextItem;
          } else {
            list.unshift(nextItem);
          }
        });

        setRecentList(list.slice(0, 30));
        renderRecent();
      }

      function normalizeEditableHtmlForMarkdown(root) {
        const clone = root.cloneNode(true);
        const all = clone.querySelectorAll("*");
        all.forEach((node) => {
          node.removeAttribute("style");
          node.removeAttribute("class");
          Array.from(node.attributes || []).forEach((attr) => {
            if (attr.name.startsWith("data-")) node.removeAttribute(attr.name);
          });
          if (node.tagName === "B") {
            const strong = document.createElement("strong");
            strong.innerHTML = node.innerHTML;
            node.replaceWith(strong);
          }
          if (node.tagName === "I") {
            const em = document.createElement("em");
            em.innerHTML = node.innerHTML;
            node.replaceWith(em);
          }
        });

        const divNodes = Array.from(clone.querySelectorAll("div"));
        divNodes.forEach((div) => {
          const parentTag = div.parentElement?.tagName;
          if (parentTag === "LI" || parentTag === "BLOCKQUOTE") return;
          const p = document.createElement("p");
          p.innerHTML = div.innerHTML || "<br>";
          div.replaceWith(p);
        });

        return clone;
      }

      function shouldUsePlainTextExtraction(root) {
        // 纯“行文本+行内样式”场景走按行序列化，避免浏览器把多行并成一段后丢换行
        return !root.querySelector("h1,h2,h3,h4,h5,h6,ul,ol,li,blockquote,pre,table,hr,img,figure,video,iframe");
      }

      function markdownFromInlineHtmlSegment(html) {
        if (!html || !html.trim()) return "";
        return turndown
          .turndown(html)
          .replace(/\r\n/g, "\n")
          .replace(/\u00A0/g, " ")
          .replace(/\n{2,}/g, "\n")
          .replace(/[ \t]+$/gm, "")
          .trim();
      }

      function markdownLinesFromParagraphLikeElement(el) {
        const marker = "__BR_MARK__";
        const clone = el.cloneNode(true);
        clone.querySelectorAll("br").forEach((br) => br.replaceWith(marker));
        return clone.innerHTML.split(marker).map((seg) => markdownFromInlineHtmlSegment(seg));
      }

      function markdownFromPlainPreview(root) {
        const lines = [];
        Array.from(root.childNodes).forEach((node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            const textLines = (node.textContent || "")
              .replace(/\r\n/g, "\n")
              .replace(/\u00A0/g, " ")
              .split("\n")
              .map((line) => line.replace(/[ \t]+$/g, ""));
            lines.push(...textLines);
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          const el = node;
          if (el.tagName === "BR") {
            lines.push("");
            return;
          }
          if (el.tagName === "P" || el.tagName === "DIV") {
            lines.push(...markdownLinesFromParagraphLikeElement(el));
            return;
          }
          const blockMarkdown = turndown.turndown(el.outerHTML || "").replace(/\r\n/g, "\n").trimEnd();
          if (!blockMarkdown) {
            lines.push("");
            return;
          }
          lines.push(...blockMarkdown.split("\n"));
        });
        const normalized = lines.map((line) => (/^\s*$/.test(line || "") ? "" : line));
        while (normalized.length > 0 && normalized[0] === "") normalized.shift();
        while (normalized.length > 0 && normalized[normalized.length - 1] === "") normalized.pop();
        return normalized.join("\n");
      }

      function markdownFromPreviewHtml() {
        const normalizedRoot = normalizeEditableHtmlForMarkdown(dom.previewHost);
        if (shouldUsePlainTextExtraction(normalizedRoot)) {
          return markdownFromPlainPreview(normalizedRoot);
        }
        return turndown.turndown(normalizedRoot.innerHTML || "");
      }

      function getPreviewCopyPayload() {
        const selection = window.getSelection();
        const hasPreviewSelection =
          !!selection &&
          selection.rangeCount > 0 &&
          !selection.isCollapsed &&
          dom.previewHost.contains(selection.anchorNode) &&
          dom.previewHost.contains(selection.focusNode);

        let html = "";
        let text = "";
        if (hasPreviewSelection) {
          const fragment = selection.getRangeAt(0).cloneContents();
          const wrap = document.createElement("div");
          wrap.appendChild(fragment);
          html = wrap.innerHTML;
          text = wrap.innerText || selection.toString();
        } else {
          html = dom.previewHost.innerHTML || "";
          text = dom.previewHost.innerText || "";
        }
        text = text.replace(/\r\n/g, "\n").trimEnd();
        return { html, text };
      }

      function syncPreviewToMarkdown(immediate = false) {
        const seq = ++previewSyncSeq;
        const commit = () => {
          if (!immediate && activeEditorType !== "preview") return;
          if (seq !== previewSyncSeq) return;
          const converted = markdownFromPreviewHtml();
          setMarkdown(converted, { fromPreview: true });
        };
        if (immediate) {
          if (previewSyncTimer) clearTimeout(previewSyncTimer);
          previewSyncTimer = null;
          commit();
          return;
        }
        if (previewSyncTimer) clearTimeout(previewSyncTimer);
        previewSyncTimer = setTimeout(() => {
          previewSyncTimer = null;
          commit();
        }, 120);
      }

      function getSelectionRangeInPreview() {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) return null;
        const range = selection.getRangeAt(0);
        if (!dom.previewHost.contains(range.startContainer) || !dom.previewHost.contains(range.endContainer)) {
          return null;
        }
        return range;
      }

      function closestTag(node, tagName) {
        let current = node?.nodeType === Node.TEXT_NODE ? node.parentElement : node;
        while (current && current !== dom.previewHost) {
          if (current.tagName === tagName) return current;
          current = current.parentElement;
        }
        return null;
      }

      function closestTags(node, tagNames) {
        let current = node?.nodeType === Node.TEXT_NODE ? node.parentElement : node;
        while (current && current !== dom.previewHost) {
          if (tagNames.includes(current.tagName)) return current;
          current = current.parentElement;
        }
        return null;
      }

      function isVisualEmpty(node) {
        if (!node) return true;
        const text = (node.textContent || "").replace(/\u200B/g, "").trim();
        if (text.length > 0) return false;
        return !node.querySelector("img,hr,table,pre,code,input,video,iframe");
      }

      function placeCaretAtStart(node) {
        const range = document.createRange();
        range.selectNodeContents(node);
        range.collapse(true);
        const selection = window.getSelection();
        selection?.removeAllRanges();
        selection?.addRange(range);
      }

      function handlePreviewKeydown(event) {
        if (activeEditorType !== "preview") return;

        if (event.key === "Tab") {
          const range = getSelectionRangeInPreview();
          if (!range) return;
          const inListItem = closestTag(range.startContainer, "LI");
          if (!inListItem) return;
          event.preventDefault();
          document.execCommand(event.shiftKey ? "outdent" : "indent");
          syncPreviewToMarkdown(true);
          return;
        }

        // Enter 行为交由浏览器 contenteditable 默认处理，避免自定义节点操作误删内容。
      }

      function getScrollRatio(scroller) {
        const max = Math.max(1, scroller.scrollHeight - scroller.clientHeight);
        return scroller.scrollTop / max;
      }

      function setScrollRatio(scroller, ratio) {
        const max = Math.max(1, scroller.scrollHeight - scroller.clientHeight);
        scroller.scrollTop = Math.max(0, Math.min(max, ratio * max));
      }

      function debounce(fn, wait = 200) {
        let t = null;
        return (...args) => {
          if (t) clearTimeout(t);
          t = setTimeout(() => fn(...args), wait);
        };
      }

      function replaceDoc(text) {
        view.dispatch({
          changes: { from: 0, to: view.state.doc.length, insert: text }
        });

      function setMarkdown(nextMarkdown, options = { fromEditor: false, fromPreview: false, fromHistory: false }) {
        appState.markdown = nextMarkdown;
        if (!options.fromEditor && view && view.state.doc.toString() !== nextMarkdown) {
          const previewRatioBefore = getScrollRatio(dom.previewBody);
          if (options.fromPreview) {
            isApplyingPreviewToSource = true;
            suppressEditorScrollSync = true;
          }
          replaceDoc(nextMarkdown);
          if (options.fromPreview) {
            isApplyingPreviewToSource = false;
            requestAnimationFrame(() => {
              setScrollRatio(dom.previewBody, previewRatioBefore);
              suppressEditorScrollSync = false;
            });
          }
        }
        if (!options.fromPreview) {
          renderPreview(appState.markdown);
        }
        if ((options.fromEditor || options.fromPreview) && !options.fromHistory) {
          pushEditHistorySnapshot(nextMarkdown);
        }
        updateStatus();
        debouncedSave();
      }

      function replaceSelection(insertText, cursorOffset = 0) {
        const sel = view.state.selection.main;
        const from = sel.from;
        const to = sel.to;
        view.dispatch({
          changes: { from, to, insert: insertText },
          selection: { anchor: from + insertText.length + cursorOffset }
        });
        view.focus();
      }

      function wrapSelection(prefix, suffix = prefix) {
        const sel = view.state.selection.main;
        const selected = view.state.doc.sliceString(sel.from, sel.to);
        if (!selected) {
          replaceSelection(`${prefix}${suffix}`, -suffix.length);
          return;
        }
        replaceSelection(`${prefix}${selected}${suffix}`);
      }

      function applyLinePrefix(prefix, ordered = false) {
        const sel = view.state.selection.main;
        const fromLine = view.state.doc.lineAt(sel.from);
        const toLine = view.state.doc.lineAt(sel.to);
        const changes = [];
        let orderNum = 1;
        for (let i = fromLine.number; i <= toLine.number; i += 1) {
          const line = view.state.doc.line(i);
          const insert = ordered ? `${orderNum}. ` : prefix;
          changes.push({ from: line.from, insert });
          orderNum += 1;
        }
        view.dispatch({ changes });
        view.focus();
      }

      function markdownToPlainText(markdownText) {
        const rendered = DOMPurify.sanitize(md.render(markdownText || ""));

      function buildExportHtml(name, markdownText) {
        const rendered = DOMPurify.sanitize(md.render(markdownText || ""));
        const title = (name || "untitled.md").replace(/\.[^/.]+$/, "");
        return `<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${escapeHtml(title)}</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; color: #222; max-width: 900px; margin: 32px auto; padding: 0 20px; }
      pre { background: #f6f8fa; border-radius: 8px; padding: 12px 14px; overflow: auto; }
      code { background: #f2f4f6; border-radius: 4px; padding: 1px 4px; }
      blockquote { border-left: 3px solid #b7c1d0; margin: 12px 0; padding: 4px 0 4px 12px; color: #57606a; }
      table { border-collapse: collapse; width: 100%; margin: 12px 0; }
      th, td { border: 1px solid #d0d7de; padding: 8px 10px; text-align: left; }
    </style>
  </head>
  <body>${rendered}</body>
</html>`;
      }

      function markdownToDocxParagraphs(markdownText) {
        const lines = (markdownText || "").replace(/\r\n/g, "\n").split("\n");
        return lines.map((line) => {
          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            const headingMap = {
              1: HeadingLevel.HEADING_1,
              2: HeadingLevel.HEADING_2,
              3: HeadingLevel.HEADING_3,
              4: HeadingLevel.HEADING_4,
              5: HeadingLevel.HEADING_5,
              6: HeadingLevel.HEADING_6
            };
            return new Paragraph({
              heading: headingMap[level] || HeadingLevel.HEADING_3,
              text: heading[2].replace(/[*_`~]/g, "")
            });
          }
          const quote = line.match(/^>\s?(.*)$/);
          if (quote) return new Paragraph({ text: `> ${quote[1].replace(/[*_`~]/g, "")}` });
          const ordered = line.match(/^\d+\.\s+(.+)$/);
          if (ordered) return new Paragraph({ text: `1. ${ordered[1].replace(/[*_`~]/g, "")}` });
          const unordered = line.match(/^[-*+]\s+(.+)$/);
          if (unordered) return new Paragraph({ text: `- ${unordered[1].replace(/[*_`~]/g, "")}` });
          return new Paragraph({ text: line.replace(/[*_`~]/g, "") });
        });
      }

      async function createPdfBlob(name, markdownText) {
        const pdf = new jsPDF({ unit: "pt", format: "a4" });
        const title = (name || "untitled.md").replace(/\.[^/.]+$/, "");
        const content = `${title}\n\n${markdownToPlainText(markdownText)}`;
        const margin = 40;
        const width = pdf.internal.pageSize.getWidth() - margin * 2;
        const lines = pdf.splitTextToSize(content, width);
        let y = 50;
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(12);
        lines.forEach((line) => {
          if (y > pdf.internal.pageSize.getHeight() - 40) {
            pdf.addPage();
            y = 50;
          }
          pdf.text(line, margin, y);
          y += 20;
        });
        return pdf.output("blob");
      }

      async function createDocxBlob(markdownText) {
        const doc = new Document({
          sections: [
            {
              properties: {},
              children: markdownToDocxParagraphs(markdownText)
            }
          ]
        });
        return Packer.toBlob(doc);
      }

      async function downloadCurrent() {

      async function downloadAs(name, content, ext) {
        const baseName = (name || "untitled").replace(/\.[^/.]+$/, "");
        if (ext === "md") {
          triggerBlobDownload(new Blob([content], { type: "text/markdown;charset=utf-8" }), `${baseName}.md`);
          return;
        }
        if (ext === "txt") {
          triggerBlobDownload(new Blob([markdownToPlainText(content)], { type: "text/plain;charset=utf-8" }), `${baseName}.txt`);
          return;
        }
        if (ext === "html") {
          triggerBlobDownload(new Blob([buildExportHtml(name, content)], { type: "text/html;charset=utf-8" }), `${baseName}.html`);
          return;
        }
        if (ext === "pdf") {
          const pdfBlob = await createPdfBlob(name, content);
          triggerBlobDownload(pdfBlob, `${baseName}.pdf`);
          return;
        }
        if (ext === "docx") {
          const docxBlob = await createDocxBlob(content);
          triggerBlobDownload(
            docxBlob,
            `${baseName}.docx`
          );
        }
      }

      function openRecent(id) {
        const list = getRecentList();
        const picked = list.find((item) => item.id === id);
        if (!picked) return;
        appState.meta = { name: picked.name, path: picked.path };
        setMarkdown(picked.content || "");
        setUiMode("edit");
        setViewMode("split");
        resetEditHistory(appState.markdown);
      }

      function searchInDoc() {
        const keyword = dom.searchInput.value.trim();
        if (!keyword) return;
        const fullText = appState.markdown;
        const from = view.state.selection.main.to;
        let idx = fullText.indexOf(keyword, from);
        if (idx < 0) idx = fullText.indexOf(keyword, 0);
        if (idx < 0) return;
        view.dispatch({
          selection: { anchor: idx, head: idx + keyword.length },
          scrollIntoView: true
        });
        view.focus();
      }

      function handleFormatAction(type) {
        if (activeEditorType !== "preview") return;
        if (type === "bold") document.execCommand("bold");
        if (type === "italic") document.execCommand("italic");
        if (type === "strike") document.execCommand("strikeThrough");
        if (type === "underline") document.execCommand("underline");
        if (type === "unordered") document.execCommand("insertUnorderedList");
        if (type === "ordered") document.execCommand("insertOrderedList");
        if (type === "quote") {
          const ok = document.execCommand("formatBlock", false, "blockquote");
          if (!ok) document.execCommand("formatBlock", false, "<blockquote>");
        }
        if (type === "code") {
          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return;
          const range = selection.getRangeAt(0);
          const code = document.createElement("code");
          code.textContent = range.toString();
          range.deleteContents();
          range.insertNode(code);
          selection.removeAllRanges();
          const newRange = document.createRange();
          newRange.selectNodeContents(code);
          selection.addRange(newRange);
        }
        syncPreviewToMarkdown(true);
        updateInlineCodeButtonState();
        updateFormatButtonsState();
        requestAnimationFrame(() => updateFormatButtonsState());
      }

      function isModKey(event) {
        return event.metaKey || event.ctrlKey;
      }

      function handleUndo() {
        applyHistoryState(historyIndex - 1);
        updateInlineCodeButtonState();
      }

      function handleRedo() {
        applyHistoryState(historyIndex + 1);
        updateInlineCodeButtonState();
      }

      function setFormatButtonsActiveState(activeMap) {
        Object.entries(richButtons).forEach(([key, btn]) => {
          if (!btn) return;
          btn.classList.toggle("is-active", !!activeMap[key]);
        });
      }

      function updateFormatButtonsState() {
        if (activeEditorType !== "preview") {
          setFormatButtonsActiveState({});
          return;
        }
        const range = getSelectionRangeInPreview();
        if (!range) {
          setFormatButtonsActiveState({});
          return;
        }
        const startNode = range.startContainer;
        const activeMap = {
          bold: document.queryCommandState("bold"),
          italic: document.queryCommandState("italic"),
          strike: document.queryCommandState("strikeThrough"),
          underline: document.queryCommandState("underline"),
          ordered: document.queryCommandState("insertOrderedList"),
          unordered: document.queryCommandState("insertUnorderedList"),
          quote: !!closestTag(startNode, "BLOCKQUOTE"),
          code: !!closestTag(startNode, "CODE")
        };
        setFormatButtonsActiveState(activeMap);
      }

      function updateInlineCodeButtonState() {
        if (activeEditorType !== "preview") {
          dom.fmtCodeBtn.classList.add("is-inactive");
          updateFormatButtonsState();
          return;
        }
        const selection = window.getSelection();
        const hasSelection = !!selection && !selection.isCollapsed && selection.toString().trim().length > 0;
        dom.fmtCodeBtn.classList.toggle("is-inactive", !hasSelection);
        updateFormatButtonsState();
      }

      const loadedData = loadCurrentFromStorage();
      appState.markdown = loadedData?.doc || defaultDoc;
      if (loadedData?.meta) appState.meta = loadedData.meta;
      if (loadedData?.theme) appState.theme = loadedData.theme;
      if (loadedData?.lang) appState.lang = loadedData.lang;
      if (loadedData?.viewMode) appState.viewMode = loadedData.viewMode;
      appState.uiMode = "initial";
      resetEditHistory(appState.markdown);

      const editorState = EditorState.create({
        doc: appState.markdown,
        extensions: [
          EditorState.readOnly.of(false),
          EditorView.editable.of(true),
          lineNumbers(),
          history(),
          markdown(),
          keymap.of([...defaultKeymap, ...historyKeymap, ...searchKeymap]),
          EditorView.lineWrapping,
          EditorView.updateListener.of((v) => {
            if (v.docChanged) {
              setMarkdown(v.state.doc.toString(), {
                fromEditor: true,
                fromPreview: isApplyingPreviewToSource
              });
            }
            if (v.docChanged || v.selectionSet) {
              updateInlineCodeButtonState();
            }
          }),
          EditorView.domEventHandlers({
            keydown(event, viewInstance) {
              // 仅编辑区生效：快捷键都绑定在编辑器事件域内
              setActiveEditorType("source");
              const key = event.key.toLowerCase();
              if (isModKey(event) && key === "s") {
                event.preventDefault();
                saveCurrentToStorage();
                return true;
              }
              if (isModKey(event) && key === "f") {
                event.preventDefault();
                dom.searchInput.focus();
                return true;
              }
              if (isModKey(event) && key === "1") {
                event.preventDefault();
                setViewMode("source");
                return true;
              }
              if (isModKey(event) && key === "2") {
                event.preventDefault();
                setViewMode("preview");
                return true;
              }
              if (isModKey(event) && key === "3") {
                event.preventDefault();
                setViewMode("split");
                return true;
              }
              return false;
            }
          })
        ]
      });

      view = new EditorView({
        state: editorState,
        parent: document.getElementById("editorHost")
      });

      const debouncedSave = debounce(saveCurrentToStorage, 300);

      // split 模式滚动同步（基础骨架）
      const editorScroller = view.scrollDOM;
      const previewScroller = dom.previewBody;
      editorScroller.addEventListener("scroll", () => {
        if (appState.viewMode !== "split" || isSyncing || suppressEditorScrollSync) return;
        isSyncing = true;
        requestAnimationFrame(() => {
          const ratio = getScrollRatio(editorScroller);
          setScrollRatio(previewScroller, ratio);
          isSyncing = false;
        });
      });

      previewScroller.addEventListener("scroll", () => {
        if (appState.viewMode !== "split" || isSyncing) return;
        isSyncing = true;
        requestAnimationFrame(() => {
          const ratio = getScrollRatio(previewScroller);
          setScrollRatio(editorScroller, ratio);
          isSyncing = false;
        });
      });

      dom.newBtn.addEventListener("click", () => {
        createNewDraft();
      });
      const jumpToInitial = () => {
        if (activeEditorType === "preview") {
          syncPreviewToMarkdown(true);
        }
        setUiMode("initial");
      };
      dom.brandHome.addEventListener("click", jumpToInitial);
      dom.brandHome.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          jumpToInitial();
        }
      });

      dom.openBtn.addEventListener("click", () => dom.fileInput.click());
      dom.fileInput.addEventListener("change", (e) => importFile(e.target.files?.[0]));

      dom.uploadBtn.addEventListener("click", handleCenterUpload);
      dom.importInput.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          handleCenterUpload();
        }
      });
      dom.importInput.addEventListener("input", () => {
        autoResizeImportInput();
      });

      dom.previewHost.addEventListener("focus", () => {
        setActiveEditorType("preview");
        updateInlineCodeButtonState();
      });
      dom.previewHost.addEventListener("blur", () => {
        syncPreviewToMarkdown(true);
        updateFormatButtonsState();
      });
      dom.previewHost.addEventListener("mouseup", () => updateInlineCodeButtonState());
      dom.previewHost.addEventListener("keyup", () => updateInlineCodeButtonState());
      dom.previewHost.addEventListener("keydown", handlePreviewKeydown);
      dom.previewHost.addEventListener("input", () => {
        syncPreviewToMarkdown(false);
        updateInlineCodeButtonState();
      });
      document.addEventListener("selectionchange", () => {
        if (activeEditorType !== "preview") return;
        updateInlineCodeButtonState();
      });

      dom.recentList.addEventListener("click", (e) => {
        const actionNode = e.target.closest("[data-action]");
        if (!actionNode) {
          if (e.target.closest(".recent-menu")) return;
          const openNode = e.target.closest("[data-recent-id]");
          if (!openNode) return;
          const id = openNode.dataset.recentId;
          if (!id || editingRecentId) return;
          openRecentMenuId = null;
          openRecent(id);
          renderRecent();
          return;
        }

        const action = actionNode.dataset.action;
        const id = actionNode.dataset.recentId;
        if (!id) return;

        if (action === "toggle-menu") {
          openRecentMenuId = openRecentMenuId === id ? null : id;
          renderRecent();
          return;
        }

        if (action === "open") {
          if (editingRecentId) return;
          openRecentMenuId = null;
          openRecent(id);
          renderRecent();
          return;
        }

        if (action === "rename") {
          renameRecent(id);
          openRecentMenuId = null;
          renderRecent();
          return;
        }

        if (action === "duplicate") {
          duplicateRecent(id);
          openRecentMenuId = null;
          renderRecent();
          return;
        }

        if (action === "delete") {
          deleteRecent(id);
          openRecentMenuId = null;
          renderRecent();
          return;
        }

        if (action === "export") {
          const list = getRecentList();
          const item = list.find((entry) => entry.id === id);
          const format = actionNode.dataset.format || "md";
          if (item) {
            downloadAs(item.name, item.content || "", format).catch(() => {
              alert(t("exportFailed"));
            });
          }
          openRecentMenuId = null;
          renderRecent();
        }
      });

      dom.recentList.addEventListener("dblclick", (e) => {
        const nameNode = e.target.closest(".recent-item-name");
        if (!nameNode) return;
        const itemNode = nameNode.closest("[data-recent-id]");
        const id = itemNode?.dataset.recentId;
        if (!id) return;
        renameRecent(id);
      });

      dom.recentList.addEventListener("keydown", (e) => {
        const openNode = e.target.closest("[data-action='open']");
        if (!openNode) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          const id = openNode.dataset.recentId;
          if (!id) return;
          openRecent(id);
          openRecentMenuId = null;
          renderRecent();
        }
      });

      dom.recentList.addEventListener("keydown", (e) => {
        const renameInput = e.target.closest("[data-action='rename-inline']");
        if (!renameInput) return;
        if (e.key === "Enter") {
          e.preventDefault();
          commitInlineRename(renameInput.dataset.recentId, renameInput.value);
        }
        if (e.key === "Escape") {
          e.preventDefault();
          cancelInlineRename();
        }
      });

      dom.recentList.addEventListener("focusout", (e) => {
        const renameInput = e.target.closest("[data-action='rename-inline']");
        if (!renameInput) return;
        requestAnimationFrame(() => {
          const active = document.activeElement;
          if (active && active.closest?.("[data-action='rename-inline']")) return;
          commitInlineRename(renameInput.dataset.recentId, renameInput.value);
        });
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".recent-item")) {
          if (openRecentMenuId !== null) {
            openRecentMenuId = null;
            renderRecent();
          }
        }
        if (!e.target.closest(".export-action-group")) {
          setExportMenuOpen(false);
        }
        if (!e.target.closest(".lang-action-group")) {
          setLangMenuOpen(false);
        }
      });

      dom.viewSourceBtn.addEventListener("click", () => setViewMode("source"));
      dom.viewPreviewBtn.addEventListener("click", () => setViewMode("preview"));
      dom.viewSplitBtn.addEventListener("click", () => setViewMode("split"));

      dom.themeBtn.addEventListener("click", () => {
        const next = appState.theme === "dark" ? "light" : "dark";
        applyTheme(next);
      });
      dom.initialThemeBtn.addEventListener("click", () => {
        const next = appState.theme === "dark" ? "light" : "dark";
        applyTheme(next);
      });
      dom.langBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setLangMenuOpen(!langMenuOpen);
      });
      dom.initialLangBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setLangMenuOpen(!langMenuOpen);
      });
      dom.langMenu.addEventListener("click", (e) => {
        const lang = e.target.dataset.langOption;
        if (!lang) return;
        applyLanguage(lang);
        setLangMenuOpen(false);
      });
      dom.initialLangMenu.addEventListener("click", (e) => {
        const lang = e.target.dataset.langOption;
        if (!lang) return;
        applyLanguage(lang);
        setLangMenuOpen(false);
      });

      dom.searchInput.addEventListener("input", () => {
        renderRecent();
      });
      dom.searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          rememberSearchKeyword(dom.searchInput.value);
        }
      });
      dom.searchInput.addEventListener("blur", () => {
        rememberSearchKeyword(dom.searchInput.value);
      });

      dom.fmtBoldBtn.addEventListener("click", () => handleFormatAction("bold"));
      dom.fmtItalicBtn.addEventListener("click", () => handleFormatAction("italic"));
      dom.fmtStrikeBtn.addEventListener("click", () => handleFormatAction("strike"));
      dom.fmtUnderlineBtn.addEventListener("click", () => handleFormatAction("underline"));
      dom.fmtOrderedBtn.addEventListener("click", () => handleFormatAction("ordered"));
      dom.fmtUnorderedBtn.addEventListener("click", () => handleFormatAction("unordered"));
      dom.fmtQuoteBtn.addEventListener("click", () => handleFormatAction("quote"));
      dom.fmtCodeBtn.addEventListener("click", () => handleFormatAction("code"));

      document.addEventListener("keydown", (event) => {
        if (activeEditorType !== "preview") return;
        if (!isModKey(event)) return;
        const key = event.key.toLowerCase();
        if (!event.shiftKey && key === "b") {
          event.preventDefault();
          handleFormatAction("bold");
        } else if (!event.shiftKey && key === "i") {
          event.preventDefault();
          handleFormatAction("italic");
        } else if (!event.shiftKey && key === "u") {
          event.preventDefault();
          handleFormatAction("underline");
        } else if (!event.shiftKey && key === "e") {
          event.preventDefault();
          handleFormatAction("code");
        } else if (event.shiftKey && key === "x") {
          event.preventDefault();
          handleFormatAction("strike");
        } else if (event.shiftKey && key === "u") {
          event.preventDefault();
          handleFormatAction("ordered");
        } else if (event.shiftKey && key === "y") {
          event.preventDefault();
          handleFormatAction("unordered");
        } else if (event.shiftKey && (event.key === ">" || key === ".")) {
          event.preventDefault();
          handleFormatAction("quote");
        }
        updateFormatButtonsState();
        requestAnimationFrame(() => updateFormatButtonsState());
      });

      dom.undoBtn.addEventListener("click", () => handleUndo());
      dom.redoBtn.addEventListener("click", () => handleRedo());
      dom.copyBtn.addEventListener("click", async () => {
        const payload = getPreviewCopyPayload();
        if (!payload.text && !payload.html) return;
        if (window.ClipboardItem && navigator.clipboard?.write) {
          const item = new ClipboardItem({
            "text/plain": new Blob([payload.text || ""], { type: "text/plain" }),
            "text/html": new Blob([payload.html || payload.text || ""], { type: "text/html" })
          });
          await navigator.clipboard.write([item]);
          return;
        }
        await navigator.clipboard.writeText(payload.text || "");
      });
      dom.downloadBtn.addEventListener("click", downloadCurrent);
      dom.exportBtn.addEventListener("click", () => setExportMenuOpen(!exportMenuOpen));
      dom.exportMenu.addEventListener("click", async (e) => {
        const action = e.target.dataset.exportAction;
        if (!action) return;
        try {
          await runExportAction(action);
        } catch {
          alert(t("exportFailed"));
        }
        setExportMenuOpen(false);
      });
      dom.deleteBtn.addEventListener("click", deleteCurrent);

      // 初始态中央上传框：拖拽导入
      ["dragenter", "dragover"].forEach((type) =>
        dom.dropZone.addEventListener(type, (e) => {
          e.preventDefault();
          dom.dropZone.classList.add("is-dragover");
        })
      );
      ["dragleave", "dragend"].forEach((type) =>
        dom.dropZone.addEventListener(type, () => {
          dom.dropZone.classList.remove("is-dragover");
        })
      );
      dom.dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dom.dropZone.classList.remove("is-dragover");
        const file = e.dataTransfer?.files?.[0];
        if (file) {
          stageDroppedFile(file).catch(() => {});
        }
      });

      // 初始化
      applyLanguage(appState.lang);
      ensurePresetRecentDocs().catch(() => {});
      renderSearchHistoryOptions();
      setViewMode(appState.viewMode);
      setUiMode("initial");
      renderPreview(appState.markdown);
      autoResizeImportInput();
      updateInlineCodeButtonState();
      updateStatus();
      saveCurrentToStorage();
      setActiveEditorType("source");
      requestAnimationFrame(() => {
        document.body.dataset.appReady = "1";
      });

      // 源码区点击即聚焦，避免出现“可见但无法输入”的焦点丢失情况
      dom.sourcePanel.addEventListener("mousedown", () => {
        setActiveEditorType("source");
        requestAnimationFrame(() => view?.focus());
      });
      dom.editorHost.addEventListener("focusin", () => {
        setActiveEditorType("source");
        updateInlineCodeButtonState();
      });
    </script>
  </body>
</html>
